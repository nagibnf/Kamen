syntax = "proto3";
package avatar;

// Common metadata for all streaming messages.
message Meta {
  string persona_id = 1;
  string session_id = 2;
  string request_id = 3;
  int64 ts_ms = 4;
}

message AudioChunk {
  Meta meta = 1;
  bytes pcm_s16le = 2;
  int32 sample_rate = 3; // 16000 for ASR input
  int32 channels = 4;    // 1
}

message AsrPartial {
  Meta meta = 1;
  string text = 2;
  bool is_final = 3;
  int64 start_ms = 4;
  int64 end_ms = 5;
  float confidence = 6;
}

message LlmRequest {
  Meta meta = 1;
  string text = 2;
  string context = 3;
  string vision_summary = 4;
  string persona_profile = 5;
}

message LlmToken {
  Meta meta = 1;
  string token = 2;
  bool is_final = 3;
  int64 latency_ms = 4;
}

message ToolCall {
  Meta meta = 1;
  string name = 2;
  string args_json = 3;
}

message ToolResult {
  Meta meta = 1;
  string name = 2;
  string result_json = 3;
  bool ok = 4;
  string error = 5;
}

message LlmEvent {
  oneof event {
    LlmToken token = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
  }
}

message TtsRequest {
  Meta meta = 1;
  string text = 2;
  string voice_profile_id = 3;
  string voice_sample_path = 4;
  float speed = 5;
  float temperature = 6;
  float top_p = 7;
}

message VideoFrame {
  Meta meta = 1;
  bytes data = 2;      // raw RGB or H264 packet
  int32 width = 3;
  int32 height = 4;
  string format = 5;   // "rgb24" or "h264"
}

message VisionSummary {
  Meta meta = 1;
  string text = 2;
  repeated string tags = 3;
}

service AsrService {
  rpc StreamAsr(stream AudioChunk) returns (stream AsrPartial);
}

service LlmService {
  rpc StreamLlm(LlmRequest) returns (stream LlmEvent);
}

service TtsService {
  rpc StreamTts(TtsRequest) returns (stream AudioChunk);
}

service LipsyncService {
  rpc StreamLipsync(stream AudioChunk) returns (stream VideoFrame);
}

service VlmService {
  rpc AnalyzeFrame(VideoFrame) returns (VisionSummary);
}
